<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
<title id="title">Clock domains</title>
<desc id="desc">The 100 MHz oscillator on pin E3 is divided by two for the GPU and by four for scanout. The only crossing is the framebuffer.</desc>
<rect x="1" y="1" width="918" height="228" rx="12" fill="#fffdfb" stroke="#e7e5e4"/>
<text x="28" y="32" fill="#78716c" font-family="Georgia, serif" font-size="13">Clock domains</text>
<text x="28" y="56" fill="#1c1917" font-family="Georgia, serif" font-size="16">One oscillator on the Nexys A7, two clocks</text>
<rect x="28" y="84" width="210" height="96" rx="8" fill="#fff" stroke="#e7e5e4"/>
<rect x="28.5" y="96" width="3" height="72" fill="#ca8a04"/>
<text x="46" y="122" fill="#ca8a04" font-family="ui-monospace,Menlo,monospace" font-size="11">E3</text>
<text x="46" y="146" fill="#1c1917" font-family="Georgia, serif" font-size="16">100 MHz</text>
<text x="46" y="166" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="12">Board oscillator</text>
<path d="M238 116 H268" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
<path d="M263 112.5 l6 3.5 -6 3.5" fill="#ca8a04"/>
<path d="M238 148 H268" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
<path d="M263 144.5 l6 3.5 -6 3.5" fill="#ca8a04"/>
<rect x="276" y="84" width="300" height="52" rx="8" fill="#fff" stroke="#e7e5e4"/>
<rect x="276.5" y="94" width="3" height="32" fill="#ca8a04"/>
<text x="294" y="106" fill="#ca8a04" font-family="ui-monospace,Menlo,monospace" font-size="11">÷2</text>
<text x="330" y="116" fill="#1c1917" font-family="Georgia, serif" font-size="16">gpu_clk · 50 MHz</text>
<rect x="590" y="84" width="302" height="52" rx="8" fill="#fffbeb" stroke="#ca8a04"/>
<text x="606" y="115" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">GPU, host, keypad, UART</text>
<rect x="276" y="148" width="300" height="52" rx="8" fill="#fff" stroke="#e7e5e4"/>
<rect x="276.5" y="158" width="3" height="32" fill="#ca8a04"/>
<text x="294" y="170" fill="#ca8a04" font-family="ui-monospace,Menlo,monospace" font-size="11">÷4</text>
<text x="330" y="180" fill="#1c1917" font-family="Georgia, serif" font-size="16">pix_clk · 25 MHz</text>
<rect x="590" y="148" width="302" height="52" rx="8" fill="#fffbeb" stroke="#ca8a04"/>
<text x="606" y="179" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Scanout, DVI, vblank</text>
</svg>
